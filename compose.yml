# ─────────────────────────────────────────────────────────────────────────────
# COMPSCI 426 — Team Project compose.yml
#
# This file defines the Holmes investigation container and a shared network.
# Add your own services below the "Add your services here" section.
#
# Every service you add must be attached to `team-net` so it is reachable
# from holmes by service name.
#
# Quick reference:
#   Start everything:          docker compose up --build
#   Open a shell in holmes:    docker compose exec holmes bash
#   View logs:                 docker compose logs -f
#   Check health:              docker compose ps
# ─────────────────────────────────────────────────────────────────────────────

networks:
  team-net:
    driver: bridge

services:

  # ── Holmes — System Investigation Container ────────────────────────────────
  # A persistent container with curl, wget, jq, k6, psql, redis-cli, Node,
  # Python, bat, lsd, fd, ripgrep, Neovim + LazyVim, and more.
  #
  # Use it to inspect and test your services from inside the Docker network:
  #
  #   docker compose exec holmes bash
  #   curl http://order-service:3000/health | jq .
  #   psql postgres://user:pass@postgres:5432/mydb
  #   redis-cli -h redis ping
  #   k6 run /workspace/k6/sprint-1.js
  #
  # Your repo root is mounted at /workspace, so all k6 scripts and files
  # are accessible without copying them into the container.
  #
  # See holmes/README.md for a full tool reference.
  holmes:
    build:
      context: ./holmes
      dockerfile: Dockerfile
    container_name: holmes
    restart: unless-stopped
    volumes:
      - .:/workspace
    networks:
      - team-net
    environment:
      - TERM=xterm-256color
    # Holmes has no ports — access it via: docker compose exec holmes bash

  # ── Add your services here ─────────────────────────────────────────────────
  #
  # Pattern for each service:
  #
  # your-service:
  #   build: ./your-service
  #   container_name: your-service
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"          # expose on host for local testing
  #   networks:
  #     - team-net             # REQUIRED — makes it reachable from holmes
  #   environment:
  #     - DATABASE_URL=postgres://user:pass@postgres:5432/yourdb
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 15s
  #

  # EVENT CATALOG SERVICE:
  event-cat-service:
    build: ./C-event-catalog
    working_dir: /app
    volumes:
      - ./C-event-catalog:/app
      - /app/node_modules
    command: npm start
    ports:
      - "3006:3001"
    environment:
      - DATABASE_URL=postgres://user:pass@event-cat-db:5432/eventcatdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      event-cat-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://event-cat-service:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - team-net

  # TICKET PURCHASE SERVICE:
  purchase-service:
    build: ./C-ticket-purchase
    container_name: purchase-service
    restart: unless-stopped
    ports:
      - "3002:3001"
    networks:
      - team-net
    environment:
      - DATABASE_URL=postgres://user:pass@purchase-db:5432/purchasedb
      - REDIS_URL=redis://redis:6379
      - PAYMENT_SERVICE_URL=http://payment-service:3001
    depends_on:
      purchase-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://purchase-service:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  # PAYMENT SERVICE:
  payment-service:
    build: ./C-payment
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "3003:3001"
    networks:
      - team-net
    environment:
      - DATABASE_URL=postgres://user:pass@purchase-db:5432/purchasedb
      - REDIS_URL=redis://redis:6379
      - SIM_SUCCESS_RATE=1.0
    depends_on:
      purchase-db:
        condition: service_healthy
      fraud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://payment-service:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # NOTIFICATION SERVICE:
  notification-service:
    build:
      context: .
      dockerfile: ./C-notification/Dockerfile
    command: node notif-service.js
    restart: unless-stopped
    ports:
      - "3004:3001"
    networks:
      - team-net
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://notification-service:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification-worker:
    build:
      context: .
      dockerfile: ./C-notification/Dockerfile
    command: node notif-worker.js
    restart: unless-stopped
    networks:
      - team-net
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://notification-worker:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # REFUND SERVICE:
  refund-service:
    build:
      context: .
      dockerfile: ./C-refund/Dockerfile
    command: node service.js
    container_name: refund-service
    restart: unless-stopped
    ports:
      - "3005:3001"
    networks:
      - team-net
    environment:
      - DATABASE_URL=postgres://user:pass@refund-db:5432/refunddb
      - REDIS_URL=redis://redis:6379
      - PIPELINE=team-03
      - QUEUE_NAME=refundRequests
      - CHECK_PURCHASE_URL=http://purchase-service:3001/purchases/
      - REVERSE_PAYMENT_URL=http://payment-service:3001/reverse
    depends_on:
      refund-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://refund-service:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  # WAITLIST WORKER:
  waitlist-worker:
    build: ./C-waitlist-worker
    container_name: waitlist-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - team-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://waitlist-worker:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # FRAUD WORKER
  fraud-worker:
    build: ./C-fraud
    container_name: fraud-worker
    restart: unless-stopped
    networks:
      - team-net
    environment:
      - DATABASE_URL=postgres://user:pass@fraud-db:5432/frauddb
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=purchase-events
      - DLQ_NAME=fraud-dlq
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://fraud-worker:3008/health"]
    depends_on:
      fraud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node worker.js

  # ANALYTICS WORKER:
  analytics-worker:
    build:
      context: .
      dockerfile: ./C-analytics/Dockerfile
    container_name: analytics-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://user:pass@analytics-db:5432/analyticsdb
    depends_on:
      redis:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    networks:
      - team-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://analytics-worker:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    
  # ── Postgres template ──────────────────────────────────────────────────────
  #
  # postgres:
  #   image: postgres:16
  #   container_name: postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: pass
  #     POSTGRES_DB: mydb
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - team-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #

  # ANALYTICS DB:
  analytics-db:
     image: postgres:16 
     container_name: analytics-db
     restart: unless-stopped
     environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: pass
        POSTGRES_DB: analyticsdb
     ports:
        - "5436:5432"
     volumes:
       - analytics-db-data:/var/lib/postgresql/data
       - ./DB-folder/DB-analytics.sql:/docker-entrypoint-initdb.d/init.sql:ro
     networks:
       - team-net
     healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d analyticsdb"]
        interval: 5s
        timeout: 3s
        retries: 5

  # EVENT CATALOG DB:
  event-cat-db:
     image: postgres:16 
     container_name: event-cat-db
     restart: unless-stopped
     environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: pass
        POSTGRES_DB: eventcatdb
     ports:
       - "5433:5432"
     volumes:
       - event-cat-db-data:/var/lib/postgresql/data
       - ./DB-folder/DB-events-catalog.sql:/docker-entrypoint-initdb.d/DB-events-catalog.sql
     networks:
       - team-net
     healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d eventcatdb"]        
        interval: 5s
        timeout: 3s
        retries: 5  

  # FRAUD DB:
  fraud-db:
     image: postgres:16 
     container_name: fraud-db
     restart: unless-stopped
     environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: pass
        POSTGRES_DB: frauddb
     ports:
        - "5434:5432"
     volumes:
       - fraud-db-data:/var/lib/postgresql/data
       - ./DB-folder/DB-fraud.sql:/docker-entrypoint-initdb.d/init.sql:ro
     networks:
       - team-net
     healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d frauddb"]
        interval: 5s
        timeout: 3s
        retries: 5
    
  # PURCHASE DB:
  purchase-db: 
      image: postgres:16 
      container_name: purchase-db
      restart: unless-stopped
      environment:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: purchasedb
      ports:
        - "5437:5432"
      volumes:
        - purchase-db-data:/var/lib/postgresql/data
        - ./DB-folder/DB-purchase.sql:/docker-entrypoint-initdb.d/init.sql:ro
      networks:
        - team-net
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U user -d purchasedb"]
          interval: 5s
          timeout: 3s
          retries: 5

  # REFUND DB:
  refund-db: 
      image: postgres:16 
      container_name: refund-db
      restart: unless-stopped
      environment:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: refunddb
      ports:
        - "5435:5432"
      volumes:
        - refund-db-data:/var/lib/postgresql/data
      networks:
        - team-net
      healthcheck:
          test: ["CMD-SHELL", "pg_isready -U user -d refunddb"]
          interval: 5s
          timeout: 3s
          retries: 5

  # ── Redis template ─────────────────────────────────────────────────────────
  #
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: redis
    restart: unless-stopped
    networks:
      - team-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    depends_on:
      - holmes
      - event-cat-service
      - purchase-service
    ports:
      - "80:80"
    networks:
      - team-net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ui:/srv:ro
# ── Named volumes ──────────────────────────────────────────────────────────────
# Declare a volume for each database here, e.g.:
#
# volumes:
#   postgres-data:
volumes:
  purchase-db-data:
  event-cat-db-data:
  fraud-db-data:
  refund-db-data:
  analytics-db-data:
